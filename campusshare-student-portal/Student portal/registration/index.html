<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="description" content="Create your CampusShare institutional account." />
  <title>Create Institutional Profile | CampusShare</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/supabase.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">
      <header class="brand-row">
        <a class="brand" href="#" aria-label="CampusShare home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 7.5h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 7.5V6a3 3 0 0 1 6 0v1.5M9 12h6M9 15h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-copy"><strong>CampusShare</strong><small>Asset Directory</small></span>
        </a>
      </header>

      <div class="intro">
        <h1 id="page-title">Create Institutional Profile</h1>
        <p>Single sign-on asset access for campus laboratories, media suites<br class="desktop-break" /> &amp; prototyping gear.</p>
      </div>

      <div class="role-picker" role="group" aria-label="Choose account type">
        <button class="role-option active" type="button" data-role="student" aria-pressed="true">
          <span class="role-icon" aria-hidden="true">♙</span>
          <span class="role-text"><strong>Student</strong><small>Active coursework checkout</small></span>
          <span class="role-tag">Borrower</span>
        </button>
        <button class="role-option" type="button" data-role="staff" aria-pressed="false">
          <span class="role-icon" aria-hidden="true">♟</span>
          <span class="role-text"><strong>Faculty / Custodian</strong><small>Facility inventory control</small></span>
          <span class="role-tag">Manager</span>
        </button>
      </div>

      

      <form id="registration-form" novalidate>
        <div class="field-group">
          <label for="full-name">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">♙</span>
            <input id="full-name" name="fullName" type="text" placeholder="e.g. Alex Chen" autocomplete="name" required minlength="2" />
          </div>
          <small class="field-error" id="name-error"></small>
        </div>

        <div class="field-group">
          <div class="label-line">
            <label for="personal-email">Personal Email (.edu)</label>
            <span class="verified-label">Campus Realm Verified</span>
          </div>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">＠</span>
            <input id="personal-email" name="email" type="email" placeholder="a.chen@university.edu" autocomplete="email" required />
          </div>
          <small class="field-error" id="email-error"></small>
        </div>

        <div class="two-column">
          <div class="field-group">
            <label for="campus-id" id="campus-id-label">StudentID / NetID</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">▣</span>
              <input id="campus-id" name="campusId" type="text" placeholder="CS-2024-8841" required />
            </div>
            <small class="field-error" id="campus-id-error"></small>
          </div>
          <div class="field-group">
            <label for="cohort" id="cohort-label">Cohort/Year</label>
            <div class="input-wrap select-wrap">
              <select id="cohort" name="cohort" required>
                <option value="">Select year</option>
                <option>UG - 1st Year </option>
                <option>UG - 2nd Year </option>
                <option >3rd year</option>
                <option>UG - 4th Year</option>
                <option>Postgraduate</option>
              </select>
            </div>
            <small class="field-error" id="cohort-error"></small>
          </div>
        </div>

        <div class="field-group">
          <label for="department">Academic Department &amp; Faculty</label>
          <div class="input-wrap select-wrap">
            <select id="department" name="department" required>
              <option value="">Choose your department</option>
              <option>Dept. of Electrical &amp; Computer Engineering</option>
              <option>Computer Science &amp; Engineering</option>
              <option>Electronics &amp; Communication Engineering</option>
              <option>Mechanical Engineering</option>
              <option>Civil Engineering</option>
              <option>Physics &amp; Applied Sciences</option>
              <option>Media Arts &amp; Design</option>
              <option>Other / Interdisciplinary</option>
            </select>
          </div>
          <small class="field-error" id="department-error"></small>
        </div>

        <div class="field-group password-group">
          <label for="password">Account Security Keyphrase</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">♙</span>
            <input id="password" name="password" type="password" placeholder="At least 12 characters" autocomplete="new-password" required minlength="12" />
            <button class="visibility-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </div>
          <div class="password-meter" aria-label="Password strength"><span id="strength-bar"></span></div>
          <div class="strength-caption"><span id="strength-text">Use 12 or more characters</span><span id="strength-level">—</span></div>
          <small class="field-error" id="password-error"></small>
        </div>

        <div class="consent-list">
          <label class="checkbox-row">
            <input type="checkbox" id="terms" name="terms" required />
            <span>I consent to university asset custody guidelines, the Zero-Damage Policy, and immediate return accountability.</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="updates" name="updates" checked />
            <span>Receive dispatch alerts when lab equipment is ready at checkout depots.</span>
          </label>
        </div>
        <small class="field-error consent-error" id="terms-error"></small>

        <button class="submit-button" type="submit" id="submit-button">Create Student Account <span aria-hidden="true">→</span></button>
      </form>

      

      <footer class="security-footer">
        <span><span aria-hidden="true">♙</span> 256-bit SSL Academic Encryption</span>
        <span><span aria-hidden="true">♜</span> FERPA Protected</span>
      </footer>
      <div class="form-message" id="form-message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="../../portal-bridge.js"></script>
</body>
</html>
