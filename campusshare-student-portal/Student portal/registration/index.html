
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="description" content="Create your CampusShare institutional account." />
  <title>Create Institutional Profile | CampusShare</title>

  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../../js/supabase.js" defer></script>
  <script src="../../js/database.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">

      <!-- BRAND -->
      <header class="brand-row">
        <a class="brand" href="#" aria-label="CampusShare home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M7 7.5h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"
                stroke="currentColor" stroke-width="1.7"/>
              <path d="M9 7.5V6a3 3 0 0 1 6 0v1.5M9 12h6M9 15h4"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>

          <span class="brand-copy">
            <strong>CampusShare</strong>
            <small>Asset Directory</small>
          </span>
        </a>
      </header>

      <!-- INTRODUCTION -->
      <div class="intro">
        <h1 id="page-title">Create Institutional Profile</h1>
        <p id="role-description">
          Single sign-on asset access for campus laboratories, media suites
          &amp; prototyping gear.
        </p>
      </div>

      <!-- ROLE SELECTOR -->
      <div class="role-picker" role="group" aria-label="Choose account type">

        <button
          class="role-option active"
          type="button"
          data-role="student"
          aria-pressed="true">

          <span class="role-icon" aria-hidden="true">♙</span>

          <span class="role-text">
            <strong>Student</strong>
            <small>Active coursework checkout</small>
          </span>

          <span class="role-tag">Borrower</span>
        </button>

        <button
          class="role-option"
          type="button"
          data-role="staff"
          aria-pressed="false">

          <span class="role-icon" aria-hidden="true">♟</span>

          <span class="role-text">
            <strong>Faculty / Custodian</strong>
            <small>Facility inventory control</small>
          </span>

          <span class="role-tag">Manager</span>
        </button>

      </div>

      <!-- ROLE INFORMATION -->
      <div class="role-notice" id="role-notice" aria-live="polite">
        Student account: complete your academic information to request
        institutional equipment.
      </div>

      <!-- REGISTRATION FORM -->
      <form id="registration-form" novalidate>

        <!-- COMMON: FULL NAME -->
        <div class="field-group">

          <label for="full-name">Full Name</label>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">♙</span>

            <input
              id="full-name"
              name="fullName"
              type="text"
              placeholder="e.g. Alex Chen"
              autocomplete="name"
              required
              minlength="2"
            />
          </div>

          <small class="field-error" id="name-error"></small>

        </div>

        <!-- COMMON: EMAIL -->
        <div class="field-group">

          <div class="label-line">
            <label for="personal-email">Institutional Email (.edu)</label>
            <span class="verified-label">Campus Realm Verified</span>
          </div>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">＠</span>

            <input
              id="personal-email"
              name="email"
              type="email"
              placeholder="a.chen@university.edu"
              autocomplete="email"
              required
            />
          </div>

          <small class="field-error" id="email-error"></small>

        </div>

        <!-- ================================== -->
        <!-- STUDENT-ONLY FIELDS                -->
        <!-- ================================== -->

        <div id="studentFields">

          <div class="two-column">

            <div class="field-group">

              <label for="campus-id">Student ID / NetID</label>

              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">▣</span>

                <input
                  id="campus-id"
                  name="campusId"
                  type="text"
                  placeholder="CS-2024-8841"
                  autocomplete="off"
                />
              </div>

              <small class="field-error" id="campus-id-error"></small>

            </div>

            <div class="field-group">

              <label for="cohort">Cohort / Year</label>

              <div class="input-wrap select-wrap">
                <select id="cohort" name="cohort">
                  <option value="">Select year</option>
                  <option>UG - 1st Year</option>
                  <option>UG - 2nd Year</option>
                  <option>UG - 3rd Year</option>
                  <option>UG - 4th Year</option>
                  <option>Postgraduate</option>
                </select>
              </div>

              <small class="field-error" id="cohort-error"></small>

            </div>

          </div>

        </div>

        <!-- ================================== -->
        <!-- STAFF-ONLY FIELDS                  -->
        <!-- ================================== -->

        <div id="staffFields" hidden>

          <!-- STAFF ID -->
          <div class="field-group">

            <label for="staff-id">Staff ID / Employee ID</label>

            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">▣</span>

              <input
                id="staff-id"
                name="staffId"
                type="text"
                placeholder="e.g. EMP-2026-001"
                autocomplete="off"
                disabled
              />
            </div>

            <small class="field-error" id="staff-id-error"></small>

          </div>

          <!-- STAFF DESIGNATION -->
          <div class="field-group">

            <label for="designation">Designation</label>

            <div class="input-wrap select-wrap">
              <select
                id="designation"
                name="designation"
                disabled>

                <option value="">Select your designation</option>
                <option value="faculty">Faculty Member</option>
                <option value="lab-assistant">Laboratory Assistant</option>
                <option value="lab-manager">Laboratory Manager</option>
                <option value="custodian">Equipment Custodian</option>

              </select>
            </div>

            <small class="field-error" id="designation-error"></small>

          </div>

          <!-- ASSIGNED LAB -->
          <div class="field-group">

            <label for="assigned-lab">Assigned Laboratory / Facility</label>

            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">⌂</span>

              <input
                id="assigned-lab"
                name="assignedLab"
                type="text"
                placeholder="e.g. Electronics and Robotics Laboratory"
                autocomplete="off"
                disabled
              />
            </div>

            <small class="field-error" id="assigned-lab-error"></small>

          </div>

        </div>

        <!-- COMMON: DEPARTMENT -->
        <div class="field-group">

          <label for="department" id="department-label">
            Academic Department
          </label>

          <div class="input-wrap select-wrap">

            <select id="department" name="department" required>

              <option value="">Choose your department</option>

              <option>Dept. of Electrical &amp; Computer Engineering</option>
              <option>Computer Science &amp; Engineering</option>
              <option>Electronics &amp; Communication Engineering</option>
              <option>Mechanical Engineering</option>
              <option>Civil Engineering</option>
              <option>Physics &amp; Applied Sciences</option>
              <option>Media Arts &amp; Design</option>
              <option>Other / Interdisciplinary</option>

            </select>

          </div>

          <small class="field-error" id="department-error"></small>

        </div>

        <!-- COMMON: PASSWORD -->
        <div class="field-group password-group">

          <label for="password">Account Security Keyphrase</label>

          <div class="input-wrap">

            <span class="input-icon" aria-hidden="true">♙</span>

            <input
              id="password"
              name="password"
              type="password"
              placeholder="At least 12 characters"
              autocomplete="new-password"
              required
              minlength="12"
            />

            <button
              class="visibility-toggle"
              id="toggle-password"
              type="button"
              aria-label="Show password"
              aria-pressed="false">

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.6"/>
              </svg>

            </button>

          </div>

          <div class="password-meter" aria-label="Password strength">
            <span id="strength-bar"></span>
          </div>

          <div class="strength-caption">
            <span id="strength-text">Use 12 or more characters</span>
            <span id="strength-level">—</span>
          </div>

          <small class="field-error" id="password-error"></small>

        </div>

        <!-- CONSENT -->
        <div class="consent-list">

          <label class="checkbox-row" id="student-consent">

            <input type="checkbox" id="terms" name="terms" required />

            <span>
              I consent to university asset custody guidelines,
              the Zero-Damage Policy, and immediate return accountability.
            </span>

          </label>

          <label class="checkbox-row" id="staff-consent" hidden>

            <input type="checkbox" id="staff-terms" name="staffTerms" disabled />

            <span>
              I confirm that the staff information provided is accurate
              and agree to institutional equipment management,
              safety and custody responsibilities.
            </span>

          </label>

          <label class="checkbox-row">

            <input
              type="checkbox"
              id="updates"
              name="updates"
              checked
            />

            <span>
              Receive dispatch alerts and CampusShare notifications.
            </span>

          </label>

        </div>

        <small class="field-error consent-error" id="terms-error"></small>

        <!-- SUBMIT -->
        <button class="submit-button" type="submit" id="submit-button">

          <span id="submit-label">Create Student Account</span>

          <span aria-hidden="true">→</span>

        </button>

      </form>

      <!-- FORM FEEDBACK -->
      <div
        class="form-message"
        id="form-message"
        role="status"
        aria-live="polite">
      </div>

    </section>
  </main>

  <script src="../../portal-bridge.js"></script>
</body>
</html>
