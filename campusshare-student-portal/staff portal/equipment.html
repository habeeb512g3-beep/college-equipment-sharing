<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#213145">
  <meta name="description" content="CampusShare staff equipment sharing portal">
  <title>CampusShare | My Equipment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <!-- The shared CampusShare shell and page content are rendered by js/app.js. -->
  <aside aria-label="Staff navigation"></aside>
  <div class="pl-72">
    <header></header>
    <main class="cs-main" id="staffMain" aria-live="polite">
      <section class="cs-hero">
        <div class="cs-kicker">CampusShare Staff Portal</div>
        <h1 class="cs-title">Loading your workspace…</h1>
        <p class="cs-subtitle">Connecting to your signed-in staff account.</p>
      </section>
    </main>
  </div>

  <!-- Single Add/Edit Equipment modal. Category and quantity inputs are added by app.js. -->
  <div id="addEquipmentModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="equipmentModalTitle">
    <div id="modalOverlay" class="absolute inset-0 bg-slate-950/60" aria-hidden="true"></div>
    <section class="relative z-10 w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
      <div class="cs-row mb-5">
        <div>
          <div class="cs-kicker">Inventory</div>
          <h2 id="equipmentModalTitle" class="text-xl font-bold">Add Equipment</h2>
        </div>
        <button id="closeAddModalBtn" type="button" class="cs-btn cs-btn-light" aria-label="Close equipment form">Close</button>
      </div>
      <div id="equipmentFormBody" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="cs-label" for="equipmentNameField">Equipment name *</label>
          <input id="equipmentNameField" class="cs-input" type="text" maxlength="160" required placeholder="e.g. Digital Multimeter">
        </div>
        <div>
          <label class="cs-label" for="equipmentLocationField">Storage location *</label>
          <input id="equipmentLocationField" class="cs-input" type="text" maxlength="160" required placeholder="e.g. Engineering Block, Room 204">
        </div>
        <div class="md:col-span-2">
          <label class="cs-label" for="equipmentDescriptionField">Description</label>
          <textarea id="equipmentDescriptionField" class="cs-textarea cs-input" rows="3" maxlength="1500" placeholder="Condition, specifications, borrowing instructions"></textarea>
        </div>
      </div>
      <div class="mt-4">
        <label class="cs-label" for="equipmentImageField">Equipment image (optional, up to 2 MB)</label>
        <input id="equipmentImageField" class="cs-input" type="file" accept="image/*">
        <img id="equipmentImagePreview" class="hidden mt-3 max-h-44 rounded-lg object-contain" alt="Selected equipment preview">
      </div>
      <div class="cs-row justify-end mt-6">
        <button id="cancelModalBtn" type="button" class="cs-btn cs-btn-light">Cancel</button>
        <button id="publishEquipmentBtn" type="button" class="cs-btn cs-btn-primary">Save Equipment</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/database.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
